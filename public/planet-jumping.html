<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Planet Jumping — Immersive Space Portal</title>
  <style>
    /* ====================================================================
       FONTS
       ==================================================================== */
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular'), local('Helvetica Neue'), local('Arial');
      font-weight: 400;
    }
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold'), local('Helvetica Neue Bold');
      font-weight: 700;
    }
    @font-face {
      font-family: 'SF Pro Thin';
      src: local('SF Pro Text Thin'), local('SF Pro Thin'), local('SFProText-Thin');
      font-weight: 100;
    }
    @font-face {
      font-family: 'Aalto';
      src: local('Aalto'), local('Aalto-Regular'), local('Arial Narrow'), local('Impact');
      font-weight: 400;
    }

    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090807;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      background: #0a0908;
    }

    .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .background.is-visible {
      opacity: 1;
    }

    .shade {
      z-index: 1;
      background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%);
      pointer-events: none;
    }

    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity .45s ease, filter .45s ease;
    }
    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    /* HEADER */
    .header {
      left: clamp(18px, 1.95vw, 28px);
      right: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .45);
      border: 1px solid rgba(255, 255, 255, .25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      text-decoration: none;
      transition: transform .2s, background .2s;
    }
    .back-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, .15);
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 5px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 19px;
      border-radius: 999px;
      line-height: 1;
      font-size: 15px;
    }
    .nav a.active {
      background: #fff;
      color: #000;
      font-weight: 700;
    }
    .menu {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    /* SIDEBAR */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
      user-select: none;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: rgba(255, 255, 255, .8);
      transition: color .2s;
    }
    .planet-item.active {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      gap: 8px;
    }
    .planet-item.active:before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }

    /* PORTAL */
    .portal-wrap {
      left: 50%;
      top: 50%;
      width: min(320px, 31vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      opacity: 0;
      font-family: 'SF Pro', Arial, sans-serif;
    }
    .portal-heading strong {
      font-size: 18px;
      margin-left: 8px;
    }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320 / 350;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transform: none !important;
    }
    .portal video, .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* CONTENT */
    .planet-content {
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }
    .planet-content h1 {
      font-family: Aalto, 'Arial Narrow', sans-serif;
      font-size: clamp(128px, 21.8vw, 314px);
      font-weight: 400;
      line-height: .72;
      margin: 0 0 -.04em;
      letter-spacing: 0;
      transform: translateX(-32px);
      opacity: 0;
      text-transform: uppercase;
    }
    .planet-content dl {
      width: min(447px, 34vw);
      margin: 0;
      font-size: 16px;
    }
    .fact {
      display: grid;
      grid-template-columns: 138px 1fr;
      gap: 18px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .48);
      opacity: 0;
      line-height: 1.35;
    }
    .fact:last-child {
      border-bottom: 0;
    }
    .fact dt {
      font-weight: 700;
    }
    .fact dd {
      margin: 0;
      color: rgba(255, 255, 255, .9);
    }

    /* MISC */
    .transition-layer { display: none; }
    .scene-canvas { display: none; }
    .loading {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      opacity: 0;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: opacity .2s;
    }
    .experience.is-loading .loading { opacity: .8; }
    .experience.is-transitioning .header,
    .experience.is-transitioning .planet-list {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .experience.is-transitioning .shade { opacity: 1; }
    .experience.is-committing .background { transition: none !important; }

    /* PRELOADER */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      overflow: hidden;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, #000);
    }
    .preloader.is-background { z-index: 0; }
    .preloader.is-background .preloader-shade { opacity: 0; }
    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 59px;
      height: 58px;
      transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition: left 2s cubic-bezier(.16, 1, .3, 1),
                  top 2s cubic-bezier(.16, 1, .3, 1),
                  width 2s cubic-bezier(.16, 1, .3, 1),
                  height 2s cubic-bezier(.16, 1, .3, 1),
                  transform 2s cubic-bezier(.16, 1, .3, 1);
    }
    .floating-logo.is-docked {
      left: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      width: 37px;
      height: 36px;
      transform: none;
    }
    .floating-logo.is-settled { z-index: 5; }

    .preloader-count {
      position: fixed;
      z-index: 22;
      left: 50%;
      bottom: clamp(22px, 3.1vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      font-family: 'SF Pro', Arial, sans-serif;
      line-height: 1;
    }
    .preloader-count > span:first-child {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 64px;
      font-weight: 100;
    }
    .preloader-count .percent {
      font-size: 24px;
      padding-bottom: 4px;
    }
    .preloader-count.is-leaving {
      animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes preload-count-out {
      to {
        opacity: 0;
        filter: blur(7px);
        transform: translate(-50%, -34px);
      }
    }
    body:not(.preload-complete) .custom-cursor { opacity: 0 !important; }

    /* CUSTOM CURSOR */
    html, body, button, a, .portal { cursor: none !important; }
    .custom-cursor {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      width: 1px;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .custom-cursor.is-visible { opacity: 1; }
    .cursor-dot, .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 12px;
      height: 12px;
      background: #fff;
    }
    .cursor-orbit {
      width: 36px;
      height: 36px;
      border: 1px solid #fff;
      background: rgba(255, 255, 255, .4);
      transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    }
    .custom-cursor.is-enter .cursor-orbit {
      transform: translate(-50%, -50%) scale(1.16);
    }
    .cursor-label {
      position: absolute;
      top: 26px;
      left: 0;
      transform: translateX(-50%) translateY(-4px);
      font: 16px/1.2 'SF Pro', Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ENTRANCE / SWITCH ANIMATIONS */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list,
    body:not(.intro-ready) .planet-content h1,
    body:not(.intro-ready) .planet-content .fact {
      opacity: 0;
    }

    .intro-ready .header {
      animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both;
    }
    .intro-ready .planet-list {
      animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both;
    }
    .content-revealing h1 {
      animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both;
    }
    .content-revealing .fact {
      animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both;
    }
    .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
    .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
    .content-revealing .fact:nth-child(4) { animation-delay: 1.0s; }

    .mask-revealing .portal-heading {
      animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both;
    }
    .planet-list.is-switching .planet-item {
      animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both;
    }
    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
    .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
    .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
    .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .20s; }
    .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }
    .planet-list.is-switching .planet-item.active:before {
      animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both;
    }

    @keyframes reveal-down {
      from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
      to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
    }
    @keyframes reveal-side {
      from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
      to   { opacity: 1; filter: blur(0);   transform: translate(0, -43%); }
    }
    @keyframes title-rise {
      from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
      to   { opacity: 1; filter: blur(0);    transform: translate(-32px, 0); }
    }
    @keyframes fact-rise {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
      to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
    }
    @keyframes portal-caption {
      from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
      to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
    }
    @keyframes menu-row {
      from { opacity: .35; transform: translateX(-8px); }
      to   { opacity: 1;   transform: translateX(0); }
    }
    @keyframes active-dot {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(300px, 48vw); }
      .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
      .planet-content dl { width: 43vw; }
      .fact { grid-template-columns: 110px 1fr; }
      .planet-list { font-size: 14px; }
      .planet-item.active { font-size: 16px; }
    }
    @media (max-width: 640px) {
      .experience { min-height: 600px; }
      .planet-list { display: none; }
      .portal-wrap { top: 44%; width: min(260px, 66vw); }
      .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
      .planet-content dl { width: 100%; font-size: 13px; }
      .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
      .portal-heading { font-size: 14px; }
      .portal-heading strong { font-size: 16px; }
      .menu { height: 38px; }
      .portal { border-radius: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
      .portal { transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="experience" data-planet="mars">
    <div class="backgrounds" aria-hidden="true">
      <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
      <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
    </div>

    <div class="preloader" id="preloader" aria-label="Loading Mars">
      <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
      <div class="preloader-shade"></div>
    </div>

    <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural">

    <div class="preloader-count" id="preloader-count" aria-live="polite">
      <span id="preloader-value">0</span><span class="percent">%</span>
    </div>

    <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <header class="header chrome">
      <a href="/" class="back-btn" aria-label="Back to home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
      </a>
      <div class="header-actions">
        <nav class="nav" aria-label="Primary navigation">
          <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
        </nav>
        <button class="menu" type="button">Menu</button>
      </div>
    </header>

    <aside class="planet-list chrome" aria-label="Planets"></aside>

    <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>

    <section class="portal-wrap chrome" aria-label="Next destination">
      <div class="portal-heading">
        <span>Next:</span>
        <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
      </div>
      <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
        <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
        <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
      </button>
    </section>

    <section class="planet-content chrome" aria-live="polite">
      <h1 id="planet-title">MARS</h1>
      <dl id="facts"></dl>
    </section>

    <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline></video></div>
    <div class="loading" aria-hidden="true">Preparing orbit…</div>
    <div class="custom-cursor" aria-hidden="true">
      <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const BASE = "https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P";
      const MARS_BG   = `${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`;
      const TO_EARTH  = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
      const TO_VENUS  = `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;
      const TO_MARS   = `${BASE}/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4`;
      const MERCURY   = `${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`;
      const LOGO      = `${BASE}/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg`;

      const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

      const states = {
        mars: {
          name: 'Mars',
          next: 'Earth',
          number: '[03]',
          portal: TO_EARTH,
          background: 'mars-background',
          facts: [
            ['Distance:', 'About 228 million km (1.5 astronomical units).'],
            ['Year:', 'One Martian year is equal to 687 Earth days.'],
            ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
            ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
          ]
        },
        earth: {
          name: 'Earth',
          next: 'Venus',
          number: '[02]',
          portal: TO_VENUS,
          background: 'earth-background',
          facts: [
            ['Distance:', '149.6 million km from the Sun.'],
            ['Year:', '365.25 Earth days.'],
            ['Temperature:', 'Average surface temperature around 15 °C.'],
            ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
          ]
        },
        venus: {
          name: 'Venus',
          next: 'Mercury',
          number: '[06]',
          image: MERCURY,
          background: 'venus-background',
          facts: [
            ['Distance:', '108.2 million km from the Sun.'],
            ['Year:', '225 Earth days.'],
            ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
            ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
          ]
        }
      };

      let current = 'mars';
      let busy = false;
      let firstRender = true;

      // DOM Elements
      const experience = document.querySelector('.experience');
      const planetTitle = document.getElementById('planet-title');
      const nextNumber = document.getElementById('next-number');
      const nextName = document.getElementById('next-name');
      const portal = document.getElementById('portal');
      const portalVideo = document.getElementById('portal-video');
      const portalImage = document.getElementById('portal-image');
      const factsDl = document.getElementById('facts');
      const planetListAside = document.querySelector('.planet-list');
      const portalCanvas = document.getElementById('portal-canvas');
      const portalCtx = portalCanvas.getContext('2d');
      const sceneCanvas = document.getElementById('scene-canvas');
      const sceneCtx = sceneCanvas.getContext('2d');
      const transitionVideo = document.getElementById('transition-video');
      const preloader = document.getElementById('preloader');
      const preloaderVideo = document.getElementById('preloader-video');
      const preloaderCount = document.getElementById('preloader-count');
      const preloaderValue = document.getElementById('preloader-value');
      const floatingLogo = document.getElementById('floating-logo');
      const customCursor = document.querySelector('.custom-cursor');
      const cursorOrbit = document.querySelector('.cursor-orbit');

      // Motion & Canvas State
      let rotX = 0, rotY = 0;
      let targetX = 0, targetY = 0;
      let lastTime = performance.now();
      let expansion = 0;
      let maskScale = 1;
      let canvasOpacity = 1;
      let transitionActive = false;
      let frozenScene = false;

      // Cursor state
      let mouseX = -100, mouseY = -100;
      let orbitX = -100, orbitY = -100;

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function animateValue(setter, duration) {
        return new Promise((resolve) => {
          const start = performance.now();
          function tick(now) {
            const elapsed = now - start;
            const progress = Math.min(1, elapsed / duration);
            const val = easeInOutCubic(progress);
            setter(val);
            if (progress < 1) {
              requestAnimationFrame(tick);
            } else {
              setter(1);
              resolve();
            }
          }
          requestAnimationFrame(tick);
        });
      }

      function resizeCanvas() {
        const d = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;

        portalCanvas.width = w * d;
        portalCanvas.height = h * d;
        portalCanvas.style.width = w + 'px';
        portalCanvas.style.height = h + 'px';
        portalCtx.setTransform(d, 0, 0, d, 0, 0);

        if (!frozenScene) {
          sceneCanvas.width = w * d;
          sceneCanvas.height = h * d;
          sceneCanvas.style.width = w + 'px';
          sceneCanvas.style.height = h + 'px';
          sceneCtx.setTransform(d, 0, 0, d, 0, 0);
        }
      }
      window.addEventListener('resize', resizeCanvas);

      function drawCover(ctx, media) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const mw = media.videoWidth || media.naturalWidth || vw;
        const mh = media.videoHeight || media.naturalHeight || vh;
        if (!mw || !mh) return;

        const scale = Math.max(vw / mw, vh / mh);
        const w = mw * scale;
        const h = mh * scale;
        const x = (vw - w) / 2;
        const y = (vh - h) / 2;

        try {
          ctx.drawImage(media, x, y, w, h);
        } catch (e) {}
      }

      function drawShade(ctx) {
        const h = window.innerHeight;
        const w = window.innerWidth;
        const grad = ctx.createLinearGradient(0, h * 0.52, 0, h);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.88)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, h * 0.52, w, h * 0.48);
      }

      function buildProjectedPath(cx, cy, w, h, r, rx, ry) {
        const points = [];
        const hw = w / 2;
        const hh = h / 2;
        const rad = Math.min(r, hw, hh);

        const arcs = [
          [ hw - rad, -hh + rad, -Math.PI / 2, 0 ],
          [ hw - rad,  hh - rad, 0, Math.PI / 2 ],
          [-hw + rad,  hh - rad, Math.PI / 2, Math.PI ],
          [-hw + rad, -hh + rad, Math.PI, Math.PI * 1.5 ]
        ];

        for (let i = 0; i < 4; i++) {
          const [acx, acy, startAngle, endAngle] = arcs[i];
          const steps = 10;
          for (let s = 0; s <= steps; s++) {
            const angle = startAngle + (endAngle - startAngle) * (s / steps);
            points.push([acx + rad * Math.cos(angle), acy + rad * Math.sin(angle)]);
          }
        }

        const ax = rx * Math.PI / 180;
        const ay = ry * Math.PI / 180;
        const cosAx = Math.cos(ax);
        const sinAx = Math.sin(ax);
        const cosAy = Math.cos(ay);
        const sinAy = Math.sin(ay);
        const focal = 850;

        portalCtx.beginPath();
        for (let i = 0; i < points.length; i++) {
          const [x, y] = points[i];
          const xx = x * cosAy;
          const yy = y * cosAx;
          const z = x * sinAy - y * sinAx;
          const p = focal / (focal + z);
          const sx = cx + xx * p;
          const sy = cy + yy * p;

          if (i === 0) {
            portalCtx.moveTo(sx, sy);
          } else {
            portalCtx.lineTo(sx, sy);
          }
        }
        portalCtx.closePath();
      }

      function draw() {
        const now = performance.now();
        const dt = Math.min(40, now - lastTime);
        lastTime = now;

        if (!busy) {
          rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
          rotY += (targetY - rotY) * Math.min(1, dt * 0.009);
        }

        portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        if (frozenScene) {
          portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
          drawShade(portalCtx);
        }

        const rect = portal.getBoundingClientRect();
        const rectCx = rect.left + rect.width / 2;
        const rectCy = rect.top + rect.height / 2;

        const e = expansion;
        const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
        const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;

        const baseW = rect.width + (window.innerWidth - rect.width) * e;
        const baseH = rect.height + (window.innerHeight - rect.height) * e;

        const scale = e > 0 ? 1 : maskScale;
        const w = baseW * scale;
        const h = baseH * scale;

        const r = 90 * (1 - e) * scale;
        const curRx = rotX * (1 - e);
        const curRy = rotY * (1 - e);

        if (w > 1 && h > 1) {
          buildProjectedPath(cx, cy, w, h, r, curRx, curRy);

          portalCtx.save();
          portalCtx.globalAlpha = canvasOpacity;
          portalCtx.clip();

          portalCtx.fillStyle = '#030303';
          portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

          const state = states[current];
          const media = transitionActive ? transitionVideo : (state.image ? portalImage : portalVideo);
          drawCover(portalCtx, media);

          if (transitionActive) {
            drawShade(portalCtx);
          }

          portalCtx.restore();
        }

        requestAnimationFrame(draw);
      }

      // Pointer Tilt Tracking
      window.addEventListener('pointermove', (e) => {
        if (busy) return;
        targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
        targetX = (e.clientY / window.innerHeight - 0.5) * -33;
      });

      window.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
      });

      // Custom Cursor Loop
      window.addEventListener('pointermove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        customCursor.classList.add('is-visible');
      });

      document.addEventListener('mouseleave', () => {
        customCursor.classList.remove('is-visible');
      });

      portal.addEventListener('pointerenter', () => {
        customCursor.classList.add('is-enter');
      });

      portal.addEventListener('pointerleave', () => {
        customCursor.classList.remove('is-enter');
      });

      function cursorLoop() {
        orbitX += (mouseX - orbitX) * 0.2;
        orbitY += (mouseY - orbitY) * 0.2;

        customCursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
        cursorOrbit.style.transform = `translate3d(${orbitX - mouseX}px, ${orbitY - mouseY}px, 0)`;

        requestAnimationFrame(cursorLoop);
      }

      function revealMask() {
        experience.classList.remove('mask-revealing');
        void experience.offsetWidth;
        experience.classList.add('mask-revealing');
        maskScale = 0;
        return animateValue((v) => { maskScale = v; }, 1050);
      }

      function revealPlanetContent() {
        experience.classList.remove('content-revealing');
        void experience.offsetWidth;
        experience.classList.add('content-revealing');
      }

      function render() {
        const state = states[current];
        experience.setAttribute('data-planet', current);
        planetTitle.textContent = state.name.toUpperCase();
        nextName.textContent = state.next;
        nextNumber.textContent = state.number;
        portal.setAttribute('aria-label', `Travel to ${state.next}`);

        // Build Facts
        factsDl.innerHTML = state.facts
          .map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`)
          .join('');

        // Build Planet List
        planetListAside.innerHTML = planets
          .map((p) => `<span class="planet-item ${p.toLowerCase() === current ? 'active' : ''}">${p}</span>`)
          .join('');

        if (!firstRender) {
          planetListAside.classList.remove('is-switching');
          void planetListAside.offsetWidth;
          planetListAside.classList.add('is-switching');
        }

        // Background Visibility
        document.querySelectorAll('.background').forEach((vid) => {
          if (vid.id === state.background) {
            vid.classList.add('is-visible');
            vid.play().catch(() => {});
          } else {
            vid.classList.remove('is-visible');
          }
        });

        // Portal Media Setup
        if (state.image) {
          portalImage.style.display = 'block';
          portalVideo.style.display = 'none';
        } else {
          portalImage.style.display = 'none';
          portalVideo.style.display = 'block';
          if (portalVideo.getAttribute('src') !== state.portal) {
            portalVideo.src = state.portal;
            portalVideo.load();
            portalVideo.play().catch(() => {});
          }
        }

        firstRender = false;
      }

      async function travel() {
        if (busy || current === 'venus') return;
        busy = true;
        targetX = 0;
        targetY = 0;

        const next = current === 'mars' ? 'earth' : 'venus';
        transitionVideo.src = states[current].portal;
        transitionVideo.load();
        experience.classList.add('is-loading');

        await new Promise((resolve) => {
          let resolved = false;
          function done() {
            if (!resolved) {
              resolved = true;
              resolve();
            }
          }
          transitionVideo.addEventListener('canplaythrough', done, { once: true });
          transitionVideo.addEventListener('error', done, { once: true });
          setTimeout(done, 1600);
        });

        experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
        experience.classList.add('is-transitioning');

        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        canvasOpacity = 1;
        transitionActive = true;

        try {
          await transitionVideo.play();
        } catch (e) {}

        await animateValue((v) => { expansion = v; }, 1100);

        await new Promise((resolve) => {
          if (transitionVideo.ended) resolve();
          else transitionVideo.addEventListener('ended', resolve, { once: true });
          setTimeout(resolve, 3500);
        });

        // Freeze last frame into scene canvas
        frozenScene = true;
        sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        drawCover(sceneCtx, transitionVideo);

        current = next;
        experience.classList.add('is-committing');
        render();

        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

        transitionActive = false;
        expansion = 0;
        maskScale = 0;
        canvasOpacity = 1;
        frozenScene = false;

        experience.classList.remove('is-transitioning', 'is-committing');

        const maskPromise = revealMask();
        setTimeout(revealPlanetContent, 100);
        await maskPromise;

        setTimeout(() => {
          transitionVideo.removeAttribute('src');
          transitionVideo.load();
          busy = false;
        }, 450);
      }

      portal.addEventListener('click', travel);

      function runPreloader() {
        let finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          preloaderValue.textContent = '100';
          preloaderCount.classList.add('is-leaving');
          floatingLogo.classList.add('is-docked');
          preloader.classList.add('is-background');
          document.body.classList.add('preload-complete');

          startExperience();

          setTimeout(() => {
            preloaderCount.remove();
          }, 750);

          setTimeout(() => {
            floatingLogo.classList.add('is-settled');
          }, 2000);
        }

        preloaderVideo.addEventListener('loadedmetadata', () => {
          preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
          preloaderVideo.play().catch(finish);
        });

        function updateProgress() {
          if (!finished && preloaderVideo.duration) {
            const pct = Math.min(99, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
            preloaderValue.textContent = String(pct);
            requestAnimationFrame(updateProgress);
          }
        }
        requestAnimationFrame(updateProgress);

        preloaderVideo.addEventListener('ended', finish);
        preloaderVideo.addEventListener('error', finish);
        setTimeout(finish, 4000); // Fail-safe
      }

      async function startExperience() {
        const state = states[current];
        const media = state.image ? portalImage : portalVideo;

        await new Promise((resolve) => {
          if (state.image) {
            if (media.complete) resolve();
            else {
              media.onload = resolve;
              media.onerror = resolve;
            }
          } else {
            if (media.readyState >= 3) resolve();
            else {
              media.addEventListener('canplay', resolve, { once: true });
              media.addEventListener('error', resolve, { once: true });
              setTimeout(resolve, 1500);
            }
          }
        });

        await revealMask();
        document.body.classList.add('intro-ready');
        setTimeout(revealPlanetContent, 850);
      }

      // Boot Order
      document.querySelectorAll('.background').forEach((v) => {
        v.pause();
        v.currentTime = 0;
      });

      resizeCanvas();
      render();
      requestAnimationFrame(draw);
      requestAnimationFrame(cursorLoop);
      runPreloader();

    })();
  </script>
</body>
</html>
